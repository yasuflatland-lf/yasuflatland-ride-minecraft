# Much of src/infrastructure, plus src/main.ts and src/test-pack/runner.ts,
# directly or indirectly calls @minecraft/server, which exists only inside
# the game; unit tests reach only part of that code with a mocked engine,
# and the in-game tests cover the rest (ADR 0010, 0012).
# Components keep that from hiding how well the pure logic is tested, without
# dropping those files from the total.
comment:
  layout: "header, diff, flags, components, files"

component_management:
  # Keep core first: the README badge reads $[0] from the components API,
  # because shields.io does not support JSONPath filters.
  individual_components:
    - component_id: core
      name: domain and application
      paths:
        - src/domain/**
        - src/application/**
    - component_id: infrastructure
      name: infrastructure
      paths:
        - src/infrastructure/**
        - src/main.ts
    - component_id: test_pack
      name: in-game test pack
      paths:
        - src/test-pack/**

# The in-game test pack is checked by the in-game tests, not by unit tests, so
# a pull request that adds in-game tests would always fail a patch or project
# status that counts it. The statuses judge the unit-tested code only; the
# test pack stays in the totals and in its own component above.
coverage:
  status:
    project:
      default:
        # Refactors that delete or move covered lines lower the ratio by a few
        # hundredths of a percent with no new untested code; the patch status
        # still catches untested additions.
        threshold: 0.1%
        paths:
          - src/domain/**
          - src/application/**
          - src/infrastructure/**
          - src/main.ts
    patch:
      default:
        paths:
          - src/domain/**
          - src/application/**
          - src/infrastructure/**
          - src/main.ts
