# Much of src/infrastructure, plus src/main.ts and the in-game test pack's
# runner.ts, arena.ts and scenarios/, directly or indirectly calls
# @minecraft/server, which exists only inside the game; unit tests reach only
# part of that code with a mocked engine, and the in-game tests cover the rest
# (ADR 0010, 0012).
# Components keep that from hiding how well the pure logic is tested, without
# dropping those files from the total.
comment:
  layout: "header, diff, flags, components, files"

component_management:
  # Keep core first: the README badge reads $[0] from the components API,
  # because shields.io does not support JSONPath filters.
  individual_components:
    - component_id: core
      name: domain and application
      paths:
        - src/domain/**
        - src/application/**
    - component_id: infrastructure
      name: infrastructure
      paths:
        - src/infrastructure/**
        - src/main.ts
    - component_id: test_pack
      name: in-game test pack
      paths:
        - src/test-pack/**

# The in-game test pack is checked by the in-game tests, not by unit tests, so
# a pull request that adds in-game tests would always fail a patch or project
# status that counts it. The statuses judge the unit-tested code only; the
# test pack stays in the totals and in its own component above.
coverage:
  status:
    project:
      default:
        # The owner allows the total to drop by up to 1% in a pull request.
        threshold: 1%
        paths:
          - src/domain/**
          - src/application/**
          - src/infrastructure/**
          - src/main.ts
    patch:
      default:
        # The target is the base commit's total, so the changed lines may be
        # covered up to 1% below it.
        threshold: 1%
        paths:
          - src/domain/**
          - src/application/**
          - src/infrastructure/**
          - src/main.ts
