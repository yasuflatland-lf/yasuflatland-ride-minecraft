name: Unit Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Install Node and pnpm as pinned in mise.toml
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - run: pnpm install --frozen-lockfile

      # Format and lint check (config files are checked even before source code lands)
      - run: pnpm exec biome ci

      # Code, comments, and docs must be in English (AGENTS.md)
      - run: pnpm run lint:lang

      # ADR metadata, the generated ADR index, and doc links (ADR 0205)
      - run: pnpm run lint:docs

      # Unused files, exports, and dependencies (ADR 0048)
      - run: pnpm run lint:unused

      # main has no source code yet, so only run these once tsconfig.json exists
      - id: src
        run: echo "present=$([ -f tsconfig.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.src.outputs.present == 'true'
        run: pnpm run typecheck

      # Import rules between layers, features, and kinds (ADR 0065)
      - if: steps.src.outputs.present == 'true'
        run: pnpm run lint:deps

      - if: steps.src.outputs.present == 'true'
        run: pnpm run build

      # Catch a yasu_ride_bp -> yasu_ride_rp dependency version mismatch before a release tag does
      - if: steps.src.outputs.present == 'true'
        run: pnpm run package

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/2 --reporter=blob --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json --coverage '--coverage.include=src/**' '--exclude=tests/tools/**' '--exclude=tests/support/pythonWorker.test.ts' '--exclude=tests/packs/{litTextures,model,sportsboat,camper,suvPbr,headlights}.test.ts'

      - uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.shard }}
          path: .vitest-reports
          include-hidden-files: true
          retention-days: 1

  # Tests that spawn Python add no src/** coverage, so they run here without
  # coverage, beside the covered shards (ADR 0204).
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vitest run tests/tools/ tests/support/pythonWorker.test.ts tests/packs/litTextures tests/packs/model.test tests/packs/sportsboat tests/packs/camper.test tests/packs/suvPbr tests/packs/headlights

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          merge-multiple: true
          path: .vitest-reports

      - id: src
        run: echo "present=$([ -f tsconfig.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.src.outputs.present == 'true'
        run: pnpm exec vitest run --merge-reports=.vitest-reports --coverage '--coverage.include=src/**' --coverage.reporter=text --coverage.reporter=lcov

      - name: Upload coverage to Codecov
        if: always() && steps.src.outputs.present == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

  # The renderer takes about 27 s, as long as the rest of the checks, so it
  # runs beside them (ADR 0054). It only needs Python's standard library.
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Depth 2 keeps the pull request's base as HEAD^1 of the merge commit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A pull request that touches none of the generators' or the renderer's inputs or outputs
      # cannot make them stale, so it skips the render (ADR 0057). Pushes to
      # main always render.
      - id: inputs
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qE '^(tools/[^/]+\.py|tools/(camping_gear|monitor_screens)\.json|packs/yasu_ride_rp/(models|render_controllers|textures/entity|textures/blocks|textures/items|animations)/|packs/yasu_ride_rp/textures/(terrain|item)_texture\.json$|packs/yasu_ride_bp/(blocks|items|item_catalog)/|packs/[^/]+/pack_icon\.png$|docs/images/|package\.json$|mise\.toml$|\.github/workflows/unit-test\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.inputs.outputs.changed == 'true'
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # The README previews and pack icons must be re-rendered whenever the model or its texture changes
      - if: steps.inputs.outputs.changed == 'true'
        run: pnpm run model:check

  # The main ruleset requires a status check named "check", so keep this job
  # id. It fails unless every job above succeeded.
  check:
    if: always()
    needs: [quick, test, tools, coverage, model]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "quick=${{ needs.quick.result }} test=${{ needs.test.result }} tools=${{ needs.tools.result }} coverage=${{ needs.coverage.result }} model=${{ needs.model.result }}"
      - if: needs.quick.result != 'success' || needs.test.result != 'success' || needs.tools.result != 'success' || needs.coverage.result != 'success' || needs.model.result != 'success'
        run: exit 1
