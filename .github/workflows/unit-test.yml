name: Unit Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Install Node and pnpm as pinned in mise.toml
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/generated-files

      # Format and lint check (config files are checked even before source code lands)
      - run: pnpm exec biome ci

      # Code, comments, and docs must be in English (AGENTS.md)
      - run: pnpm run lint:lang

      # ADR metadata, the generated ADR index, and doc links (ADR 0205)
      - run: pnpm run lint:docs

      # Unused files, exports, and dependencies, including source used only by unit tests (ADR 0048)
      - run: pnpm run lint:unused

      # main has no source code yet, so only run these once tsconfig.json exists
      - id: src
        run: echo "present=$([ -f tsconfig.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.src.outputs.present == 'true'
        run: pnpm run typecheck

      # Import rules between layers, features, and kinds (ADR 0065)
      - if: steps.src.outputs.present == 'true'
        run: pnpm run lint:deps

      - if: steps.src.outputs.present == 'true'
        run: pnpm run build

      # Catch a yasu_ride_bp -> yasu_ride_rp dependency version mismatch before a release tag does
      - if: steps.src.outputs.present == 'true'
        run: pnpm run package

      # Last and independent of earlier failures, so a missing bump does not hide the other checks (ADR 0015)
      - name: Check Resource Pack version on pull requests
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-rp-version.mjs "$BASE"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/generated-files

      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/2 --reporter=default --reporter=blob --reporter=junit --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json --outputFile.junit=test-results/junit-${{ matrix.shard }}.xml --coverage '--coverage.include=src/**' '--exclude=tests/tools/**' '--exclude=tests/support/pythonWorker.test.ts' '--exclude=tests/packs/{litTextures,model,sportsboat,camper,camperDecorFit,suvPbr,headlights,scooterModel}.test.ts'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blob-${{ matrix.shard }}
          path: .vitest-reports
          include-hidden-files: true
          retention-days: 1

      # Test Analytics: failure rates and flaky tests. Not a gate, so a missing token or an outage cannot fail the job.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/junit-${{ matrix.shard }}.xml
          fail_ci_if_error: false

  # Tests that spawn Python add no src/** coverage, so they run here without
  # coverage, beside the covered shards (ADR 0204).
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/generated-files

      - run: pnpm exec vitest run tests/tools/ tests/support/pythonWorker.test.ts tests/packs/litTextures tests/packs/model.test tests/packs/sportsboat tests/packs/camper.test tests/packs/camperDecorFit.test tests/packs/suvPbr tests/packs/headlights tests/packs/scooterModel.test.ts --reporter=default --reporter=junit --outputFile.junit=test-results/junit-tools.xml

      # Test Analytics: failure rates and flaky tests. Not a gate, so a missing token or an outage cannot fail the job.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/junit-tools.xml
          fail_ci_if_error: false

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/generated-files

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          merge-multiple: true
          path: .vitest-reports

      - id: src
        run: echo "present=$([ -f tsconfig.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.src.outputs.present == 'true'
        run: pnpm exec vitest run --merge-reports=.vitest-reports --coverage '--coverage.include=src/**' --coverage.reporter=text --coverage.reporter=lcov

      - name: Upload coverage to Codecov
        if: always() && steps.src.outputs.present == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

  model-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scenes: ${{ steps.plan.outputs.scenes }}
      others: ${{ steps.plan.outputs.others }}
    steps:
      # Depth 2 keeps the pull request's base as HEAD^1 of the merge commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only -z HEAD^1 HEAD | python3 -I -B tools/select_model_scenes.py > "$RUNNER_TEMP/model-plan.json"
          else
            python3 -I -B tools/select_model_scenes.py --all > "$RUNNER_TEMP/model-plan.json"
          fi
          python3 -I -B - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "model-plan.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("scenes=" + json.dumps(plan["scenes"], separators=(",", ":")) + "\n")
              output.write("others=" + str(plan["others"]).lower() + "\n")
          PYTHON

  model-others:
    needs: model-plan
    if: needs.model-plan.outputs.others == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YASU_ATLAS_PACK_CACHE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - uses: ./.github/actions/generated-files
      - if: github.event_name == 'pull_request'
        run: python3 -I tools/run_generators.py --check --only gen_model.py gen_sportsboat.py gen_camper.py gen_bulldozer.py gen_scooter.py gen_vehicle_switch_docs.py gen_build_tools.py gen_build_particles.py gen_warp_art.py gen_camping_gear.py gen_item_catalog.py gen_low_chair.py gen_sofa.py gen_noga_chair.py gen_camp_table.py gen_fire_pit.py gen_dutch_oven.py gen_gas_lantern.py gen_tent.py gen_beach_parasol.py gen_beach_chair.py gen_dining_table.py gen_dining_chair.py gen_roof_tent.py gen_toilet.py gen_washstand.py
      - if: github.event_name == 'push'
        run: pnpm run model:check

  model-scene:
    needs: model-plan
    if: needs.model-plan.outputs.scenes != '[]'
    name: model (${{ matrix.scene }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YASU_ATLAS_PACK_CACHE: "0"
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJSON(needs.model-plan.outputs.scenes) }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - uses: ./.github/actions/generated-files
      - env:
          SCENE: ${{ matrix.scene }}
        run: python3 -I tools/run_generators.py --check --only "render_preview.py:$SCENE"

  # The main ruleset requires a status check named "check", so keep this job
  # id. Only the conditional model jobs may be skipped (ADR 0057).
  check:
    if: always()
    needs: [quick, test, tools, coverage, model-plan, model-others, model-scene]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "quick=${{ needs.quick.result }} test=${{ needs.test.result }} tools=${{ needs.tools.result }} coverage=${{ needs.coverage.result }} model-plan=${{ needs.model-plan.result }} model-others=${{ needs.model-others.result }} model-scene=${{ needs.model-scene.result }}"
      - if: needs.quick.result != 'success' || needs.test.result != 'success' || needs.tools.result != 'success' || needs.coverage.result != 'success' || needs.model-plan.result != 'success' || (needs.model-others.result != 'success' && needs.model-others.result != 'skipped') || (needs.model-scene.result != 'success' && needs.model-scene.result != 'skipped')
        run: exit 1
