name: Integration Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the in-game tests (ADR 0010) against the dev BDS from server/compose.yaml (ADR 0011).
  in-game:
    name: in-game (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each job still pays about 27 s of fixed setup (ADR 0054).
        # Keep four serial shards and add one full-suite lanes job.
        include:
          - label: "1/4"
            shard: "1/4"
            lanes: "1"
          - label: "2/4"
            shard: "2/4"
            lanes: "1"
          - label: "3/4"
            shard: "3/4"
            lanes: "1"
          - label: "4/4"
            shard: "4/4"
            lanes: "1"
          - label: "lanes"
            shard: ""
            lanes: "4"
    steps:
      - uses: actions/checkout@v7

      # main has no in-game test runner yet, so only run the rest once it exists
      - id: runner
        run: |
          if [ -f scripts/game-test.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::scripts/game-test.mjs does not exist yet; skipping in-game tests"
          fi

      - if: steps.runner.outputs.present == 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - if: steps.runner.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.runner.outputs.present == 'true'
        run: pnpm run build

      - name: Start the dev BDS
        if: steps.runner.outputs.present == 'true'
        run: |
          node scripts/setup-dev-world.mjs
          # The packs are bind-mounted inside server/data, so Docker would create
          # behavior_packs/ and resource_packs/ as root and the container (not root)
          # could not unpack the vanilla packs next to ours. Create them first.
          mkdir -p server/data/behavior_packs server/data/resource_packs
          # The container writes the world into this bind mount as a different UID than the runner.
          chmod -R a+rwX server/data
          docker compose -f server/compose.yaml up -d

      - name: Wait for the server to start
        if: steps.runner.outputs.present == 'true'
        # The image downloads BDS on first start, which takes a while on a fresh runner.
        run: |
          for i in $(seq 1 120); do
            if docker logs yasuflatland-ride-bds 2>&1 | grep -q "Server started"; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' yasuflatland-ride-bds)" != true ]; then
              echo "::error::BDS container exited before the server started"
              exit 1
            fi
            if [ $((i % 6)) = 0 ]; then
              echo "still waiting ($((i * 5))s): $(docker logs yasuflatland-ride-bds 2>&1 | tail -n 1)"
            fi
            sleep 5
          done
          echo "::error::BDS did not start within 10 minutes"
          exit 1

      - if: steps.runner.outputs.present == 'true'
        run: pnpm run test:game
        env:
          GAME_TEST_SHARD: ${{ matrix.shard }}
          GAME_TEST_LANES: ${{ matrix.lanes }}

      # Show the start as well as the end: a burst of repeated errors can push
      # the first, telling line out of a plain tail.
      - name: Dump BDS logs on failure
        if: failure() && steps.runner.outputs.present == 'true'
        run: |
          docker logs yasuflatland-ride-bds > bds.log 2>&1 || true
          echo "--- first 150 lines ---"
          head -n 150 bds.log
          echo "--- last 150 lines ---"
          tail -n 150 bds.log

      - name: Stop the dev BDS
        if: always() && steps.runner.outputs.present == 'true'
        run: docker compose -f server/compose.yaml down
