# Dev Bedrock Dedicated Server (ADR 0015). Start it with `pnpm server:up` or
# `pnpm server:restart`, which set BDS_TRANSPORT and BDS_UDP_PORTS and write the
# dev-only manifests in data/dev-manifests (ADR 0062).
name: yasuflatland-ride-dev
services:
  bds:
    image: itzg/minecraft-bedrock-server
    container_name: yasuflatland-ride-bds
    environment:
      EULA: "TRUE"
      VERSION: "LATEST"
      LEVEL_NAME: "yasuflatland-ride-dev"
      LEVEL_TYPE: "FLAT"
      GAMEMODE: "creative"
      ALLOW_CHEATS: "true"
      ALLOW_LIST: "false"
      TRANSPORT: "${BDS_TRANSPORT:-nethernet}"
      # NetherNet only: "<LAN IP>:19140-19155:19140-19155", so clients are told
      # the Mac's address and a published port instead of the container's.
      SERVER_UDP_PORTS: "${BDS_UDP_PORTS:-}"
      TEXTUREPACK_REQUIRED: "true"
      CONTENT_LOG_FILE_ENABLED: "true"
      CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true"
    ports:
      # nethernet: signaling, then one UDP port per client from the range
      - "19132:19132/tcp"
      - "19140-19155:19140-19155/udp"
      # raknet fallback: gameplay
      - "19132:19132/udp"
    volumes:
      - ./data:/data
      - ../packs/yasu_ride_bp:/data/behavior_packs/yasu_ride_bp:ro
      - ../packs/yasu_ride_test_bp:/data/behavior_packs/yasu_ride_test_bp:ro
      - ../packs/yasu_ride_rp:/data/resource_packs/yasu_ride_rp:ro
      # Serve the Resource Pack under a fresh dev-only version (ADR 0062).
      # Without create_host_path, Docker would mount an empty directory when
      # the manifests were not generated; this way `up` fails instead.
      - type: bind
        source: ./data/dev-manifests/yasu_ride_rp/manifest.json
        target: /data/resource_packs/yasu_ride_rp/manifest.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/dev-manifests/yasu_ride_bp/manifest.json
        target: /data/behavior_packs/yasu_ride_bp/manifest.json
        read_only: true
        bind:
          create_host_path: false
    network_mode: bridge
    stdin_open: true
    tty: true
